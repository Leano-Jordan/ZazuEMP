name: Zazu quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Copy environment
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Verify built asset manifest
        run: |
          php -r '$manifest = json_decode(file_get_contents("public/build/manifest.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($manifest as $entry) { if (isset($entry["file"]) && !is_file("public/build/".$entry["file"])) { fwrite(STDERR, "Missing built asset: ".$entry["file"].PHP_EOL); exit(1); } } echo "Asset manifest verified.".PHP_EOL;'

      - name: Validate application configuration
        run: |
          php artisan config:cache
          php artisan config:clear

      - name: Create database
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force

      - name: Test service-worker authentication cache races
        run: npm run test:service-worker

      - name: Run application tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Zazu quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit locked npm dependencies
        run: node scripts/audit-npm.mjs

      - name: Validate installation, security and recovery documentation
        run: npm run check:docs

      - name: Build production frontend assets
        run: npm run build

      - name: Enforce compressed frontend asset budgets
        run: npm run check:performance

      - name: Test service-worker authentication cache races
        run: npm run test:service-worker

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
      - name: Install locked PHP dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Enforce PHP formatting on changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -t php_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.php')
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No PHP files changed; incremental Pint gate has nothing to check."
            exit 0
          fi
          vendor/bin/pint --test "${php_files[@]}"

  composer-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

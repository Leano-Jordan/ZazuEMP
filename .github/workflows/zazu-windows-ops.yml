name: Zazu Windows Ops Scripts

on:
  push:
    branches: [main]
    paths:
      - 'ops/windows/*.ps1'
      - 'Start-Zazu-Dev.cmd'
      - 'Start-Zazu-LAN.cmd'
      - 'Stop-Zazu-Dev.cmd'
      - 'Start-Zazu-LAN-HTTPS.cmd'
      - 'Stop-Zazu-LAN-HTTPS.cmd'
      - '.github/workflows/zazu-windows-ops.yml'
  pull_request:
    paths:
      - 'ops/windows/*.ps1'
      - 'Start-Zazu-Dev.cmd'
      - 'Start-Zazu-LAN.cmd'
      - 'Stop-Zazu-Dev.cmd'
      - 'Start-Zazu-LAN-HTTPS.cmd'
      - 'Stop-Zazu-LAN-HTTPS.cmd'
      - '.github/workflows/zazu-windows-ops.yml'

permissions:
  contents: read

jobs:
  powershell-parse:
    name: Parse Windows host scripts
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path 'ops/windows' -Filter '*.ps1' -File
          if (-not $scripts) {
            throw 'No Windows operations scripts were found.'
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($script.Name):"
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax validation failed for $($script.Name)."
            }

            Write-Host "PASS: $($script.Name)"
          }

      - name: Verify LAN HTTPS command wrappers
        shell: pwsh
        run: |
          $required = @(
            'Start-Zazu-LAN-HTTPS.cmd',
            'Stop-Zazu-LAN-HTTPS.cmd',
            'ops/windows/Start-ZazuLanHttps.ps1',
            'ops/windows/Stop-ZazuLanHttps.ps1'
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required LAN HTTPS launcher file is missing: $path"
            }
          }

          $startWrapper = Get-Content 'Start-Zazu-LAN-HTTPS.cmd' -Raw
          $stopWrapper = Get-Content 'Stop-Zazu-LAN-HTTPS.cmd' -Raw
          if ($startWrapper -notmatch 'Start-ZazuLanHttps\.ps1') {
            throw 'Start wrapper does not invoke Start-ZazuLanHttps.ps1.'
          }
          if ($stopWrapper -notmatch 'Stop-ZazuLanHttps\.ps1') {
            throw 'Stop wrapper does not invoke Stop-ZazuLanHttps.ps1.'
          }
          Write-Host 'PASS: LAN HTTPS wrappers reference their matching scripts.'
      - name: Verify LAN HTTPS startup failure cleanup
        shell: pwsh
        run: |
          $launcher = Get-Content 'ops/windows/Start-ZazuLanHttps.ps1' -Raw
          $validationIndex = $launcher.IndexOf('$validation = & $caddy validate')
          $startIndex = $launcher.IndexOf('& $startServer @startArguments')
          if ($validationIndex -lt 0 -or $startIndex -lt 0 -or $startIndex -lt $validationIndex) {
            throw 'Laravel must start only after the generated Caddy configuration validates.'
          }

          $cleanupCount = ([regex]::Matches($launcher, [regex]::Escape('& $startServer -Stop -Port $AppPort'))).Count
          if ($cleanupCount -lt 3) {
            throw 'Caddy launch, early-exit and bind-timeout failures must stop the loopback Laravel process.'
          }
          if ($launcher -notmatch '(?s)try\s*\{\s*\$caddyProcess\s*=\s*Start-Process.*?\}\s*catch\s*\{\s*& \$startServer -Stop -Port \$AppPort') {
            throw 'A Caddy process launch/PID-write failure must clean up the Laravel process.'
          }
          if ($launcher -notmatch '(?s)\$caddyProcess = \$null\s*try\s*\{\s*\$caddyProcess = Start-Process.*?\}\s*catch\s*\{\s*\$startupError = \$_.*?Stop-Process -Id \$caddyProcess\.Id -Force -ErrorAction SilentlyContinue') {
            throw 'A Caddy process started before PID persistence fails must be stopped.'
          }
          if ($launcher -notmatch '(?s)catch\s*\{\s*\$startupError = \$_.*?Remove-Item \$pidPath -Force -ErrorAction SilentlyContinue') {
            throw 'A failed Caddy startup must remove any partial PID file.'
          }
          if ($launcher -notmatch '(?s)catch\s*\{\s*\$startupError = \$_.*?throw \$startupError') {
            throw 'Cleanup must preserve and rethrow the original Caddy startup error.'
          }
          Write-Host 'PASS: proxy validation precedes Laravel startup and proxy failures clean up Laravel.'


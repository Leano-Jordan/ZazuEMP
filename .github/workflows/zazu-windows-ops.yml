name: Zazu Windows Ops Scripts

on:
  push:
    branches: [main]
    paths:
      - 'ops/windows/*.ps1'
      - 'Start-Zazu-Dev.cmd'
      - 'Install-Zazu.cmd'
      - 'Start-Zazu-LAN.cmd'
      - 'Stop-Zazu-Dev.cmd'
      - 'Start-Zazu-LAN-HTTPS.cmd'
      - 'Stop-Zazu-LAN-HTTPS.cmd'
      - '.github/workflows/zazu-windows-ops.yml'
  pull_request:
    paths:
      - 'ops/windows/*.ps1'
      - 'Start-Zazu-Dev.cmd'
      - 'Install-Zazu.cmd'
      - 'Start-Zazu-LAN.cmd'
      - 'Stop-Zazu-Dev.cmd'
      - 'Start-Zazu-LAN-HTTPS.cmd'
      - 'Stop-Zazu-LAN-HTTPS.cmd'
      - '.github/workflows/zazu-windows-ops.yml'

permissions:
  contents: read

jobs:
  powershell-parse:
    name: Parse Windows host scripts
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path 'ops/windows' -Filter '*.ps1' -File
          if (-not $scripts) {
            throw 'No Windows operations scripts were found.'
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $($script.Name):"
              foreach ($parseError in $errors) {
                Write-Host ("Line {0}, column {1}: {2} [{3}]" -f $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message, $parseError.ErrorId)
                Write-Host ("Source: {0}" -f $parseError.Extent.Text)
              }
              throw "PowerShell syntax validation failed for $($script.Name)."
            }

            Write-Host "PASS: $($script.Name)"
          }

      - name: Verify LAN launchers use compiled frontend assets
        shell: pwsh
        run: |
          $hostLauncher = Get-Content 'ops/windows/Start-ZazuDev.ps1' -Raw
          $httpsLauncher = Get-Content 'ops/windows/Start-ZazuLanHttps.ps1' -Raw
          $lanWrapper = Get-Content 'Start-Zazu-LAN.cmd' -Raw
          $devWrapper = Get-Content 'Start-Zazu-Dev.cmd' -Raw

          if ($hostLauncher -notmatch '\[switch\]\$BuiltAssetsOnly') {
            throw 'The shared host launcher does not expose its compiled-assets mode.'
          }
          foreach ($required in @(
            'function Prepare-ZazuBuiltAssets',
            '$hotFile = Join-Path $publicDirectory ''hot''',
            '$manifestFile = Join-Path $buildDirectory ''manifest.json''',
            '$entry.Value.css',
            '$entry.Value.assets',
            'Get-Command npm.cmd',
            'run build',
            'ConvertFrom-Json',
            'Compiled Zazu CSS/JavaScript manifest and every referenced asset are ready'
          )) {
            if (-not $hostLauncher.Contains($required)) {
              throw "Compiled-assets startup contract is missing: $required"
            }
          }
          if ($hostLauncher -notmatch '(?s)if \(\(\$Lan -or \$BuiltAssetsOnly\) -and -not \$Stop\)\s*\{\s*Prepare-ZazuBuiltAssets\s*\}') {
            throw 'LAN and explicit built-assets startup must validate the compiled bundle before launching Laravel.'
          }
          if ($hostLauncher -match '\[string\]\$ProjectPath\s*=.*\$PSScriptRoot') {
            throw 'Project root must not be resolved in the parameter default expression.'
          }
          if ($hostLauncher -notmatch '(?s)if \(\[string\]::IsNullOrWhiteSpace\(\$ProjectPath\)\)\s*\{\s*\$scriptDirectory = Split-Path -Parent \$PSCommandPath\s*\$ProjectPath = \(Resolve-Path \(Join-Path \$scriptDirectory') {
            throw 'The host launcher must resolve its default project root from PSCommandPath inside the script body.'
          }
          if ($hostLauncher -notmatch '\$attempt -lt 45') {
            throw 'The LAN host launcher must allow a bounded 45-second cold start.'
          }
          if ($hostLauncher -notmatch 'function Get-ZazuStartupLogTail' -or $hostLauncher -notmatch 'Startup output:`n\{0\}') {
            throw 'Startup failures must print the captured Laravel stdout/stderr tail for direct diagnosis.'
          }
          if ($httpsLauncher -notmatch 'BuiltAssetsOnly = \$true') {
            throw 'The LAN HTTPS launcher must force the compiled-assets path.'
          }
          if (-not $hostLauncher.Contains('[switch]$SecureCookies') -or -not $httpsLauncher.Contains('SecureCookies = $true')) {
            throw 'The HTTPS host process must opt into Secure session cookies.'
          }
          if (-not $hostLauncher.Contains('config:clear') -or -not $hostLauncher.Contains('$env:SESSION_SECURE_COOKIE = ''true''') -or -not $hostLauncher.Contains('[Environment]::SetEnvironmentVariable')) {
            throw 'Secure-cookie mode must clear stale Laravel config, set the environment override and restore the launcher environment.'
          }
          $httpStopIndex = $httpsLauncher.IndexOf('& $startServer -Stop -Port $AppPort')
          $httpsStartIndex = $httpsLauncher.IndexOf('& $startServer @startArguments')
          if ($httpStopIndex -lt 0 -or $httpsStartIndex -lt 0 -or $httpStopIndex -gt $httpsStartIndex) {
            throw 'HTTPS mode must replace a previously running HTTP-mode app process before starting with Secure cookies.'
          }
          foreach ($rangeCheck in @(
            '$_.IPAddress -match ''^10\.''',
            '$_.IPAddress -match ''^192\.168\.''',
            '$_.IPAddress -match ''^172\.(1[6-9]|2[0-9]|3[01])\.'''
          )) {
            if (-not $httpsLauncher.Contains($rangeCheck)) {
              throw "The LAN HTTPS host is missing a private IPv4 range check: $rangeCheck"
            }
          }
          if (-not (Get-Content '.gitignore' -Raw).Contains('/tools/caddy.exe')) {
            throw 'The downloaded Caddy executable must be ignored by Git.'
          }
          if ($lanWrapper -notmatch 'Start-ZazuDev\.ps1.*-Lan') {
            throw 'The plain LAN wrapper must use the shared LAN-safe startup path.'
          }
          if ($devWrapper -notmatch 'Start-ZazuDev\.ps1' -or $devWrapper -match 'BuiltAssetsOnly') {
            throw 'Loopback development must retain the normal Vite development workflow.'
          }
          Write-Host 'PASS: LAN/HTTPS launchers use verified same-origin compiled assets; loopback development remains unchanged.'

      - name: Verify database updates are backed up before Windows startup
        shell: pwsh
        run: |
          $launcherPath = (Resolve-Path 'ops/windows/Start-ZazuDev.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($launcherPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseMessages = @($parseErrors | ForEach-Object { $_.Message })
            throw ("Windows startup script has PowerShell syntax errors: " + ($parseMessages -join '; '))
          }
          $launcher = Get-Content $launcherPath -Raw
          foreach ($required in @(
            'function Prepare-ZazuDatabase',
            'migrate:status',
            'zazu:backup',
            'migrate',
            'migrate:status',
            'Backup ready:',
            'Recovery backup:'
          )) {
            if (-not $launcher.Contains($required)) {
              throw "Safe database update startup requirement is missing: $required"
            }
          }

          $backupIndex = $launcher.IndexOf("'zazu:backup'")
          $migrationIndex = $launcher.IndexOf("'migrate' '--force' '--no-interaction'")
          $prepareIndex = $launcher.IndexOf('Prepare-ZazuDatabase $php')
          $serverStartIndex = $launcher.IndexOf('$process = Start-Process -FilePath $php')

          if ($backupIndex -lt 0 -or $migrationIndex -lt 0 -or $backupIndex -gt $migrationIndex) {
            throw 'The complete installation backup must be created before applying database updates.'
          }
          if ($prepareIndex -lt 0 -or $serverStartIndex -lt 0 -or $prepareIndex -gt $serverStartIndex) {
            throw 'Database status and safe updates must be checked before the Laravel server starts.'
          }
          if ($launcher -notmatch 'backupArchives\.Count -ne 1' -or $launcher -notmatch 'backupArchives\[0\]\.Length -le 0') {
            throw 'The startup check must verify that a non-empty backup archive exists before updating the database.'
          }
          Write-Host 'PASS: Pending database updates require a verified full backup and are checked before the server starts.'
          $alreadyRunningStart = $launcher.IndexOf('if ($alreadyZazu)')
          $alreadyRunningEnd = $launcher.IndexOf('if ($wrongBinding.Count -gt 0', $alreadyRunningStart)
          if ($alreadyRunningStart -lt 0 -or $alreadyRunningEnd -lt 0) {
            throw 'Could not locate the existing-server startup guard.'
          }
          $alreadyRunningBlock = $launcher.Substring($alreadyRunningStart, $alreadyRunningEnd - $alreadyRunningStart)
          foreach ($required in @(
            "'migrate:status'",
            '$hasPendingMigrations',
            'No migration was applied while the server was active',
            'Stop-Zazu-Dev.cmd',
            'Start-Zazu-Dev.cmd'
          )) {
            if (-not $alreadyRunningBlock.Contains($required)) {
              throw "Existing-server migration safety check is missing: $required"
            }
          }
          if ($alreadyRunningBlock.Contains("'migrate' '--force'")) {
            throw 'The existing-server guard must never apply migrations while the server is active.'
          }
          Write-Host 'PASS: An already-running Zazu process cannot silently bypass pending migration detection.'


      - name: Verify DB-001 read-only SQLite diagnostic
        shell: pwsh
        run: |
          $diagnostic = Get-Content 'ops/windows/Test-ZazuDatabaseSchema.ps1' -Raw
          foreach ($required in @(
            'migrate:status',
            '2026_11_17_000001_add_event_schedule_fields',
            'event_end_date',
            'event_start_time',
            'event_end_time',
            'setup_date',
            'collection_date',
            'business_user_primary_niche_exists',
            'PRAGMA integrity_check',
            'No migrations were run and no database records or schema were changed.'
          )) {
            if (-not $diagnostic.Contains($required)) {
              throw "Read-only DB-001 diagnostic contract is missing: $required"
            }
          }
          if ($diagnostic -match "artisan.*'migrate'.*'--force'|artisan.*'zazu:restore'|artisan.*'zazu:backup'") {
            throw 'The read-only DB-001 diagnostic must not run migrations, backups or restores.'
          }
          Write-Host 'PASS: DB-001 schema diagnostic checks migration ledger, required SQLite columns and integrity without mutation.'

      - name: Verify the packaged Windows installer contract
        shell: pwsh
        run: |
          $installer = Get-Content 'ops/windows/Install-Zazu.ps1' -Raw
          $wrapper = Get-Content 'Install-Zazu.cmd' -Raw

          foreach ($required in @(
            'vendor\autoload.php',
            'public\build\manifest.json',
            "APP_ENV = 'production'",
            "APP_DEBUG = 'false'",
            "SESSION_SECURE_COOKIE = 'false'",
            'php.exe',
            '$script:PhpPath -m',
            'pdo_sqlite',
            'key:generate',
            "'migrate', '--force'"
          )) {
            if (-not $installer.Contains($required)) {
              throw "Packaged installer requirement is missing: $required"
            }
          }

          if ($installer -notmatch 'if \(-not \(Test-Path \$environmentPath -PathType Leaf\)\)') {
            throw 'The installer must preserve an existing .env file.'
          }
          if ($installer -match 'db:seed|ZAZU_SEED_DEMO') {
            throw 'The release installer must not seed development demo records.'
          }
          if ($wrapper -notmatch 'ops\\windows\\Install-Zazu\.ps1') {
            throw 'Install-Zazu.cmd does not invoke the PowerShell installer.'
          }
          Write-Host 'PASS: Windows package installer validates runtime, creates a first-run environment, preserves existing data/configuration and migrates without demo seeding.'

      - name: Verify daily owner-PC backup automation
        shell: pwsh
        run: |
          $installer = Get-Content 'ops/windows/Install-ZazuBackupSchedule.ps1' -Raw
          $runner = Get-Content 'ops/windows/Invoke-ZazuScheduledBackup.ps1' -Raw
          $hostLauncher = Get-Content 'ops/windows/Start-ZazuDev.ps1' -Raw
          $installScript = Get-Content 'ops/windows/Install-Zazu.ps1' -Raw
          $envExample = Get-Content '.env.example' -Raw
          foreach ($required in @('Register-ScheduledTask', '-Daily', "'2:00AM'", '-LogonType S4U', '-StartWhenAvailable', '-WakeToRun')) {
            if (-not $installer.Contains($required)) { throw "Daily backup task installer is missing: $required" }
          }
          foreach ($required in @("'zazu:backup'", 'zazu-backups\daily', 'Select-Object -Skip 14', 'zazu-backup-scheduler-')) {
            if (-not $runner.Contains($required)) { throw "Daily backup runner is missing: $required" }
          }
          foreach ($required in @('Install-ZazuBackupSchedule.ps1', 'Latest installation backup:', 'TotalHours -gt 26', 'LOG_STACK=daily')) {
            if (-not $hostLauncher.Contains($required)) { throw "Owner-PC startup safeguards are missing: $required" }
          }
          foreach ($source in @($installScript, $envExample)) {
            if (-not $source.Contains('LOG_STACK=daily')) { throw 'Daily log rotation is not configured for installation.' }
          }

          # Exercise task registration with mocked Windows Task Scheduler cmdlets.
          function New-ScheduledTaskAction { param($Execute, $Argument, $WorkingDirectory) [pscustomobject]@{ Execute=$Execute; Argument=$Argument; WorkingDirectory=$WorkingDirectory } }
          function New-ScheduledTaskTrigger { param([switch]$Daily, $At) [pscustomobject]@{ Daily=$Daily.IsPresent; At=$At } }
          function New-ScheduledTaskPrincipal { param($UserId, $LogonType, $RunLevel) [pscustomobject]@{ UserId=$UserId; LogonType=$LogonType; RunLevel=$RunLevel } }
          function New-ScheduledTaskSettingsSet { param([switch]$StartWhenAvailable, [switch]$WakeToRun, $MultipleInstances, $ExecutionTimeLimit, [switch]$AllowStartIfOnBatteries, [switch]$DontStopIfGoingOnBatteries) [pscustomobject]@{ StartWhenAvailable=$StartWhenAvailable.IsPresent; WakeToRun=$WakeToRun.IsPresent; MultipleInstances=$MultipleInstances; ExecutionTimeLimit=$ExecutionTimeLimit; AllowStartIfOnBatteries=$AllowStartIfOnBatteries.IsPresent; DontStopIfGoingOnBatteries=$DontStopIfGoingOnBatteries.IsPresent } }
          function Register-ScheduledTask { param($TaskName, $Action, $Trigger, $Principal, $Settings, $Description, [switch]$Force) $script:CapturedTask=[pscustomobject]@{ TaskName=$TaskName; Action=$Action; Trigger=$Trigger; Principal=$Principal; Settings=$Settings; Description=$Description; Force=$Force.IsPresent } }
          $fixture = Join-Path $env:RUNNER_TEMP 'zazu-backup-task-fixture'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $fixture 'artisan') -Force | Out-Null
          try {
            & 'ops/windows/Install-ZazuBackupSchedule.ps1' -ProjectPath $fixture
            if (-not $script:CapturedTask -or $script:CapturedTask.Trigger.At -ne '2:00AM') { throw 'Daily 02:00 backup trigger was not registered.' }
            if ($script:CapturedTask.Principal.LogonType -ne 'S4U') { throw 'Backup task must not store a Windows password.' }
            if (-not $script:CapturedTask.Settings.StartWhenAvailable -or -not $script:CapturedTask.Settings.WakeToRun) { throw 'Backup task must catch up and wake the PC when supported.' }
            if (-not $script:CapturedTask.Action.Argument.Contains('Invoke-ZazuScheduledBackup.ps1')) { throw 'Backup task runner is not wired.' }
          } finally {
            Remove-Item -LiteralPath $fixture -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'PASS: Daily 02:00 S4U backup task, catch-up, runner, retention and daily logs are wired.'

      - name: Verify LAN HTTPS command wrappers
        shell: pwsh
        run: |
          $required = @(
            'Start-Zazu-LAN-HTTPS.cmd',
            'Stop-Zazu-LAN-HTTPS.cmd',
            'ops/windows/Start-ZazuLanHttps.ps1',
            'ops/windows/Stop-ZazuLanHttps.ps1'
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required LAN HTTPS launcher file is missing: $path"
            }
          }

          $startWrapper = Get-Content 'Start-Zazu-LAN-HTTPS.cmd' -Raw
          $stopWrapper = Get-Content 'Stop-Zazu-LAN-HTTPS.cmd' -Raw
          if ($startWrapper -notmatch 'Start-ZazuLanHttps\.ps1') {
            throw 'Start wrapper does not invoke Start-ZazuLanHttps.ps1.'
          }
          if ($stopWrapper -notmatch 'Stop-ZazuLanHttps\.ps1') {
            throw 'Stop wrapper does not invoke Stop-ZazuLanHttps.ps1.'
          }
          Write-Host 'PASS: LAN HTTPS wrappers reference their matching scripts.'
      - name: Verify LAN HTTPS startup failure cleanup
        shell: pwsh
        run: |
          $launcher = Get-Content 'ops/windows/Start-ZazuLanHttps.ps1' -Raw
          $validationIndex = $launcher.IndexOf('$validation = & $caddy validate')
          $startIndex = $launcher.IndexOf('& $startServer @startArguments')
          if ($validationIndex -lt 0 -or $startIndex -lt 0 -or $startIndex -lt $validationIndex) {
            throw 'Laravel must start only after the generated Caddy configuration validates.'
          }

          $cleanupCount = ([regex]::Matches($launcher, [regex]::Escape('& $startServer -Stop -Port $AppPort'))).Count
          if ($cleanupCount -lt 3) {
            throw 'Caddy launch, early-exit and bind-timeout failures must stop the loopback Laravel process.'
          }
          if ($launcher -notmatch '(?s)try\s*\{\s*\$caddyProcess\s*=\s*Start-Process.*?\}\s*catch\s*\{\s*\$startupError\s*=\s*\$_.*?try\s*\{\s*& \$startServer -Stop -Port \$AppPort') {
            throw 'A Caddy process launch/PID-write failure must clean up the Laravel process.'
          }
          if ($launcher -notmatch '(?s)\$caddyProcess = \$null\s*try\s*\{\s*\$caddyProcess = Start-Process.*?\}\s*catch\s*\{\s*\$startupError = \$_.*?Stop-Process -Id \$caddyProcess\.Id -Force -ErrorAction SilentlyContinue') {
            throw 'A Caddy process started before PID persistence fails must be stopped.'
          }
          if ($launcher -notmatch '(?s)catch\s*\{\s*\$startupError = \$_.*?Remove-Item \$pidPath -Force -ErrorAction SilentlyContinue') {
            throw 'A failed Caddy startup must remove any partial PID file.'
          }
          if ($launcher -notmatch '(?s)catch\s*\{\s*\$startupError = \$_.*?throw \$startupError') {
            throw 'Cleanup must preserve and rethrow the original Caddy startup error.'
          }
          if ($launcher -notmatch '(?s)if \(\$caddyProcess\.HasExited\)\s*\{.*?Remove-Item \$pidPath -Force -ErrorAction SilentlyContinue\s*& \$startServer -Stop -Port \$AppPort\s*throw') {
            throw 'Caddy early-exit handling must remove the PID and stop Laravel before reporting failure.'
          }
          if ($launcher -notmatch '(?s)if \(-not \$ready\)\s*\{.*?Stop-Process -Id \$caddyProcess\.Id -Force.*?Remove-Item \$pidPath -Force -ErrorAction SilentlyContinue\s*& \$startServer -Stop -Port \$AppPort\s*throw') {
            throw 'HTTPS listener timeout must stop Caddy, remove the PID and stop Laravel before reporting failure.'
          }
          if (-not $launcher.Contains("BindAddress = '127.0.0.1'") -or $launcher -notmatch 'reverse_proxy 127\.0\.0\.1:\$AppPort') {
            throw 'Laravel must remain loopback-only behind the Caddy HTTPS proxy.'
          }
          Write-Host 'PASS: HTTPS validation, loopback proxy boundary and all startup failure cleanup paths are present.'


name: Zazu Windows V1 Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'ops/windows/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'Start-Zazu-*.cmd'
      - 'Install-Zazu.cmd'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/V1_PACKAGE_INSTALLATION.md'
      - '.github/workflows/zazu-windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Windows installation candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: Build production frontend assets
        run: |
          npm ci
          npm run build

      - name: Verify package prerequisites
        run: |
          test -f vendor/autoload.php
          test -s public/build/manifest.json
          php -r '$manifest = json_decode(file_get_contents("public/build/manifest.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($manifest as $entry) { foreach (array_filter(array_merge([$entry["file"] ?? null], $entry["css"] ?? [], $entry["assets"] ?? [])) as $asset) { if (!is_file("public/build/".$asset)) { throw new RuntimeException("Missing asset: ".$asset); } } } echo "Production dependencies and compiled assets verified.".PHP_EOL;'

      - name: Assemble clean Windows installation
        env:
          PACKAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/zazu-package"
          mkdir -p "$package_root/ZazuEMP"
          git archive HEAD | tar -x -C "$package_root/ZazuEMP"

          rm -rf \
            "$package_root/ZazuEMP/.agents" \
            "$package_root/ZazuEMP/.ai" \
            "$package_root/ZazuEMP/.github" \
            "$package_root/ZazuEMP/tests" \
            "$package_root/ZazuEMP/e2e" \
            "$package_root/ZazuEMP/prelaunch" \
            "$package_root/ZazuEMP/reference ui ux images" \
            "$package_root/ZazuEMP/docker" \
            "$package_root/ZazuEMP/docs" \
            "$package_root/ZazuEMP/vendor" \
            "$package_root/ZazuEMP/node_modules"

          rm -f \
            "$package_root/ZazuEMP/AGENTS.md" \
            "$package_root/ZazuEMP/CLAUDE.md" \
            "$package_root/ZazuEMP/CONTRIBUTING.md" \
            "$package_root/ZazuEMP/README.md" \
            "$package_root/ZazuEMP/ROSCORE_PROJECT_MANIFEST.md" \
            "$package_root/ZazuEMP/IP_OWNERSHIP.md" \
            "$package_root/ZazuEMP/memory.md" \
            "$package_root/ZazuEMP/.npmrc" \
            "$package_root/ZazuEMP/Dockerfile" \
            "$package_root/ZazuEMP/render.yaml" \
            "$package_root/ZazuEMP/.dockerignore" \
            "$package_root/ZazuEMP/package.json" \
            "$package_root/ZazuEMP/package-lock.json" \
            "$package_root/ZazuEMP/vite.config.js"

          cp -a vendor "$package_root/ZazuEMP/vendor"
          mkdir -p "$package_root/ZazuEMP/public/build"
          cp -a public/build/. "$package_root/ZazuEMP/public/build/"
          mkdir -p "$package_root/ZazuEMP/docs"
          cp docs/V1_PACKAGE_INSTALLATION.md "$package_root/ZazuEMP/docs/"
          cp docs/V1_PACKAGE_INSTALLATION.md "$package_root/ZazuEMP/README.md"
          cp docs/LOCAL_PC_HOST_DEPLOYMENT.md "$package_root/ZazuEMP/docs/"
          cp docs/RELEASE_BACKUP_RESTORE_RUNBOOK.md "$package_root/ZazuEMP/docs/"

          (
            cd "$package_root/ZazuEMP"
            cp .env.example .env
            php artisan package:discover --ansi
            rm -f .env
          )

          cat > "$package_root/ZazuEMP/PACKAGE-MANIFEST.txt" <<EOF
          Zazu EMP — Windows V1 installation candidate
          Commit: $PACKAGE_SHA
          PHP runtime: 8.4+
          Database: fresh local SQLite
          Frontend: compiled production assets
          Composer dependencies: production only
          Package type: fresh installation; not an in-place updater
          Build timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          mkdir -p "$RUNNER_TEMP/zazu-output"
          cd "$package_root"
          zip -qr "$RUNNER_TEMP/zazu-output/ZazuEMP-v1-candidate-${PACKAGE_SHA:0:7}.zip" ZazuEMP
          cd "$RUNNER_TEMP/zazu-output"
          sha256sum *.zip > SHA256SUMS.txt

      - name: Upload Windows installation candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zazu-emp-windows-v1-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zazu-output/*.zip
            ${{ runner.temp }}/zazu-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


  windows-fresh-install-smoke:
    name: Verify fresh install on Windows PowerShell
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP 8.4 with SQLite
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies and compiled assets
        shell: powershell
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Composer production dependency install failed.' }

          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite production asset build failed.' }

          php artisan package:discover --ansi
          if ($LASTEXITCODE -ne 0) { throw 'Laravel package discovery failed.' }

      - name: Verify Windows backup and private-media recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = (Get-Location).Path

          # Use a disposable sentinel table and private file so this drill proves
          # that Windows ZIP/SQLite recovery restores both data classes.
          $privateDirectory = Join-Path $project 'storage/app/private/windows-recovery-acceptance'
          $privateProbe = Join-Path $privateDirectory 'media-probe.txt'
          New-Item -ItemType Directory -Path $privateDirectory -Force | Out-Null
          [System.IO.File]::WriteAllText($privateProbe, 'private media before restore', [System.Text.UTF8Encoding]::new($false))

          $seedProbe = @'
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec('CREATE TABLE IF NOT EXISTS zazu_windows_recovery_probe (id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
          $db->exec("DELETE FROM zazu_windows_recovery_probe");
          $db->exec("INSERT INTO zazu_windows_recovery_probe (id, value) VALUES (1, 'before-restore')");
          '@
          php -r $seedProbe
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the Windows recovery database sentinel.' }

          $backupDirectory = Join-Path $env:RUNNER_TEMP 'zazu-windows-recovery-backup'
          New-Item -ItemType Directory -Path $backupDirectory -Force | Out-Null
          php artisan zazu:backup "--output=$backupDirectory"
          if ($LASTEXITCODE -ne 0) { throw 'Windows backup command failed.' }

          $archives = @(Get-ChildItem -Path $backupDirectory -Filter 'zazu-backup-*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows backup archive; found $($archives.Count)." }
          $archive = $archives[0]

          $mutateProbe = @'
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec("UPDATE zazu_windows_recovery_probe SET value = 'after-mutation' WHERE id = 1");
          '@
          php -r $mutateProbe
          if ($LASTEXITCODE -ne 0) { throw 'Could not mutate the Windows recovery database sentinel.' }
          [System.IO.File]::WriteAllText($privateProbe, 'private media after mutation', [System.Text.UTF8Encoding]::new($false))

          php artisan zazu:restore $archive.FullName --force
          if ($LASTEXITCODE -ne 0) { throw 'Windows restore command failed.' }

          $verifyProbe = @'
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          echo (string) $db->query('SELECT value FROM zazu_windows_recovery_probe WHERE id = 1')->fetchColumn();
          '@
          $restoredValue = (& php -r $verifyProbe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $restoredValue -ne 'before-restore') {
            throw "Windows restore did not recover the original database value (received: $restoredValue)."
          }

          $restoredMedia = [System.IO.File]::ReadAllText($privateProbe)
          if ($restoredMedia -ne 'private media before restore') {
            throw 'Windows restore did not recover the original private-media bytes.'
          }

          Write-Host "PASS: Windows backup/restore recovered the SQLite sentinel and private media from $($archive.Name)."
      - name: Run the first-install script using Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = (Get-Location).Path

          & (Join-Path $project 'ops/windows/Install-Zazu.ps1') -ProjectPath $project

          if (-not (Test-Path '.env' -PathType Leaf)) { throw 'Installer did not create .env.' }
          if (-not (Test-Path 'database/database.sqlite' -PathType Leaf)) { throw 'Installer did not create the SQLite database.' }

          $envLines = Get-Content '.env'
          foreach ($required in @(
            '^APP_ENV=production$',
            '^APP_DEBUG=false$',
            '^APP_URL=http://127\.0\.0\.1:8000$',
            '^SESSION_SECURE_COOKIE=false$',
            '^DB_CONNECTION=sqlite$',
            '^DB_DATABASE=database/database\.sqlite$'
          )) {
            if (-not ($envLines -match $required)) {
              throw "First-install environment is missing expected production/local setting: $required"
            }
          }

          if (-not ($envLines -match '^APP_KEY=base64:.+')) {
            throw 'Installer did not generate a Laravel application key.'
          }

          php artisan migrate:status --no-ansi
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-install database migration status failed.' }

          php artisan route:list --path=login --no-ansi
          if ($LASTEXITCODE -ne 0) { throw 'Application route boot failed after installation.' }

          $stdout = Join-Path $env:RUNNER_TEMP 'zazu-http-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'zazu-http-smoke.err.log'
          $server = Start-Process -FilePath 'php' -ArgumentList @('artisan', 'serve', '--host=127.0.0.1', '--port=8787') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              if ($server.HasExited) { throw 'Laravel HTTP smoke server exited before becoming ready.' }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/login' -UseBasicParsing -TimeoutSec 3
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $response -or $response.StatusCode -ne 200) {
              throw 'The local login page did not return HTTP 200 after installation.'
            }

            $setCookie = [string]$response.Headers['Set-Cookie']
            if ([string]::IsNullOrWhiteSpace($setCookie)) {
              throw 'The local login page did not issue a session cookie.'
            }
            if ($setCookie -match '(?i)(^|;)\s*Secure(\s*;|$)') {
              throw 'The loopback HTTP session cookie is marked Secure and may not persist on the default local HTTP origin.'
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host 'PASS: Windows PowerShell fresh install generated a private environment and app key, migrated SQLite, booted routes, and returned a usable loopback HTTP session cookie.'

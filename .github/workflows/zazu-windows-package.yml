name: Zazu Windows V1 Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'phpunit.xml'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'ops/windows/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'Start-Zazu-*.cmd'
      - 'Install-Zazu.cmd'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/V1_PACKAGE_INSTALLATION.md'
      - '.github/workflows/zazu-windows-package.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional semantic version to publish as a GitHub prerelease (for example 1.0.0-rc.1). Leave blank for a build-only run.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Windows installation candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sodium, tokenizer, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: Build production frontend assets
        run: |
          npm ci
          npm run build

      - name: Verify package prerequisites
        run: |
          test -f vendor/autoload.php
          test -s public/build/manifest.json
          php -r '$manifest = json_decode(file_get_contents("public/build/manifest.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($manifest as $entry) { foreach (array_filter(array_merge([$entry["file"] ?? null], $entry["css"] ?? [], $entry["assets"] ?? [])) as $asset) { if (!is_file("public/build/".$asset)) { throw new RuntimeException("Missing asset: ".$asset); } } } echo "Production dependencies and compiled assets verified.".PHP_EOL;'

      - name: Assemble clean Windows installation
        env:
          PACKAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/zazu-package"
          mkdir -p "$package_root/ZazuEMP"
          git archive HEAD | tar -x -C "$package_root/ZazuEMP"

          rm -rf \
            "$package_root/ZazuEMP/.agents" \
            "$package_root/ZazuEMP/.ai" \
            "$package_root/ZazuEMP/.github" \
            "$package_root/ZazuEMP/tests" \
            "$package_root/ZazuEMP/e2e" \
            "$package_root/ZazuEMP/prelaunch" \
            "$package_root/ZazuEMP/reference ui ux images" \
            "$package_root/ZazuEMP/docker" \
            "$package_root/ZazuEMP/docs" \
            "$package_root/ZazuEMP/vendor" \
            "$package_root/ZazuEMP/node_modules"

          rm -f \
            "$package_root/ZazuEMP/AGENTS.md" \
            "$package_root/ZazuEMP/CLAUDE.md" \
            "$package_root/ZazuEMP/CONTRIBUTING.md" \
            "$package_root/ZazuEMP/README.md" \
            "$package_root/ZazuEMP/ROSCORE_PROJECT_MANIFEST.md" \
            "$package_root/ZazuEMP/IP_OWNERSHIP.md" \
            "$package_root/ZazuEMP/memory.md" \
            "$package_root/ZazuEMP/.npmrc" \
            "$package_root/ZazuEMP/Dockerfile" \
            "$package_root/ZazuEMP/render.yaml" \
            "$package_root/ZazuEMP/.dockerignore" \
            "$package_root/ZazuEMP/package.json" \
            "$package_root/ZazuEMP/package-lock.json" \
            "$package_root/ZazuEMP/vite.config.js"

          cp -a vendor "$package_root/ZazuEMP/vendor"
          mkdir -p "$package_root/ZazuEMP/public/build"
          cp -a public/build/. "$package_root/ZazuEMP/public/build/"
          mkdir -p "$package_root/ZazuEMP/docs"
          cp docs/V1_PACKAGE_INSTALLATION.md "$package_root/ZazuEMP/docs/"
          cp docs/V1_PACKAGE_INSTALLATION.md "$package_root/ZazuEMP/README.md"
          cp docs/LOCAL_PC_HOST_DEPLOYMENT.md "$package_root/ZazuEMP/docs/"
          cp docs/RELEASE_BACKUP_RESTORE_RUNBOOK.md "$package_root/ZazuEMP/docs/"

          (
            cd "$package_root/ZazuEMP"
            cp .env.example .env
            php artisan package:discover --ansi
            rm -f .env
          )

          cat > "$package_root/ZazuEMP/PACKAGE-MANIFEST.txt" <<EOF
          Zazu EMP — Windows V1 installation candidate
          Commit: $PACKAGE_SHA
          PHP runtime: 8.4+
          Database: fresh local SQLite
          Frontend: compiled production assets
          Composer dependencies: production only
          Package type: fresh installation; not an in-place updater
          Build timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          mkdir -p "$RUNNER_TEMP/zazu-output"
          cd "$package_root"
          zip -qr "$RUNNER_TEMP/zazu-output/ZazuEMP-v1-candidate-${PACKAGE_SHA:0:7}.zip" ZazuEMP
          cd "$RUNNER_TEMP/zazu-output"
          sha256sum *.zip > SHA256SUMS.txt

      - name: Upload Windows installation candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zazu-emp-windows-v1-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zazu-output/*.zip
            ${{ runner.temp }}/zazu-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


  windows-fresh-install-smoke:
    name: Verify fresh install on Windows PowerShell
    needs: package
    runs-on: windows-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP 8.4 with SQLite
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sodium, tokenizer, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Validate local server launcher PowerShell and HTTP readiness contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path (Get-Location).Path 'ops/windows/Start-ZazuDev.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ("Local server launcher has PowerShell syntax errors:" + [Environment]::NewLine + ($errors | Out-String))
          }

          $source = Get-Content -LiteralPath $scriptPath -Raw
          if ($source -notmatch '(?s)function Test-ZazuHttpEndpoint.*?HttpWebRequest') {
            throw 'The local launcher must define its Laravel HTTP readiness probe.'
          }
          if ($source -notmatch '(?s)if \(Test-ZazuTcpEndpoint\)\s*\{\s*\$tcpReady = \$true\s*if \(Test-ZazuHttpEndpoint\)') {
            throw 'The local launcher must require HTTP readiness after the TCP listener opens.'
          }
          if ($source -notmatch 'healthy HTTP response') {
            throw 'The local launcher must distinguish an HTTP bootstrap failure from a closed TCP port.'
          }
          Write-Host 'PASS: local server launcher parses and requires a healthy Laravel HTTP response.'

      - name: Install production dependencies and compiled assets
        shell: powershell
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Composer production dependency install failed.' }

          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite production asset build failed.' }

          php artisan package:discover --ansi
          if ($LASTEXITCODE -ne 0) { throw 'Laravel package discovery failed.' }

      - name: Verify Windows backup and private-media recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = (Get-Location).Path

          # Use a disposable sentinel table and private file so this drill proves
          # that Windows ZIP/SQLite recovery restores both data classes.
          $privateDirectory = Join-Path $project 'storage/app/private/windows-recovery-acceptance'
          $privateProbe = Join-Path $privateDirectory 'media-probe.txt'
          New-Item -ItemType Directory -Path $privateDirectory -Force | Out-Null
          [System.IO.File]::WriteAllText($privateProbe, 'private media before restore', [System.Text.UTF8Encoding]::new($false))

          $seedProbe = @'
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec('CREATE TABLE IF NOT EXISTS zazu_windows_recovery_probe (id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
          $db->exec("DELETE FROM zazu_windows_recovery_probe");
          $db->exec("INSERT INTO zazu_windows_recovery_probe (id, value) VALUES (1, 'before-restore')");
          '@
          $seedScript = Join-Path $env:RUNNER_TEMP 'zazu-recovery-seed.php'
          [System.IO.File]::WriteAllText($seedScript, "<?php`n" + $seedProbe, [System.Text.UTF8Encoding]::new($false))
          php $seedScript
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the Windows recovery database sentinel.' }

          $backupDirectory = Join-Path $env:RUNNER_TEMP 'zazu-windows-recovery-backup'
          New-Item -ItemType Directory -Path $backupDirectory -Force | Out-Null
          php artisan zazu:backup "--output=$backupDirectory"
          if ($LASTEXITCODE -ne 0) { throw 'Windows backup command failed.' }

          $archives = @(Get-ChildItem -Path $backupDirectory -Filter 'zazu-backup-*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows backup archive; found $($archives.Count)." }
          $archive = $archives[0]

          $mutateProbe = @'
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec("UPDATE zazu_windows_recovery_probe SET value = 'after-mutation' WHERE id = 1");
          '@
          $mutateScript = Join-Path $env:RUNNER_TEMP 'zazu-recovery-mutate.php'
          [System.IO.File]::WriteAllText($mutateScript, "<?php`n" + $mutateProbe, [System.Text.UTF8Encoding]::new($false))
          php $mutateScript
          if ($LASTEXITCODE -ne 0) { throw 'Could not mutate the Windows recovery database sentinel.' }
          [System.IO.File]::WriteAllText($privateProbe, 'private media after mutation', [System.Text.UTF8Encoding]::new($false))

          php artisan zazu:restore $archive.FullName --force
          if ($LASTEXITCODE -ne 0) { throw 'Windows restore command failed.' }

          $verifyProbe = @'
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          echo (string) $db->query('SELECT value FROM zazu_windows_recovery_probe WHERE id = 1')->fetchColumn();
          '@
          $verifyScript = Join-Path $env:RUNNER_TEMP 'zazu-recovery-verify.php'
          [System.IO.File]::WriteAllText($verifyScript, "<?php`n" + $verifyProbe, [System.Text.UTF8Encoding]::new($false))
          $restoredValue = (& php $verifyScript | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $restoredValue -ne 'before-restore') {
            throw "Windows restore did not recover the original database value (received: $restoredValue)."
          }

          $restoredMedia = [System.IO.File]::ReadAllText($privateProbe)
          if ($restoredMedia -ne 'private media before restore') {
            throw 'Windows restore did not recover the original private-media bytes.'
          }

          Write-Host "PASS: Windows backup/restore recovered the SQLite sentinel and private media from $($archive.Name)."
      - name: Verify Windows restore clears stale files for empty private storage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = (Get-Location).Path
          $privateRoot = Join-Path $project 'storage/app/private'
          if (Test-Path -LiteralPath $privateRoot) {
            Remove-Item -LiteralPath $privateRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $privateRoot -Force | Out-Null

          $seedScript = Join-Path $env:RUNNER_TEMP 'zazu-empty-private-seed.php'
          $seedPhp = @'
          <?php
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec("UPDATE zazu_windows_recovery_probe SET value = 'before-empty-private-restore' WHERE id = 1");
          '@
          [System.IO.File]::WriteAllText($seedScript, $seedPhp, [System.Text.UTF8Encoding]::new($false))
          php $seedScript
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the empty-private-storage recovery sentinel.' }

          $backupDirectory = Join-Path $env:RUNNER_TEMP 'zazu-windows-empty-private-backup'
          New-Item -ItemType Directory -Path $backupDirectory -Force | Out-Null
          php artisan zazu:backup "--output=$backupDirectory"
          if ($LASTEXITCODE -ne 0) { throw 'Windows backup of empty private storage failed.' }

          $archives = @(Get-ChildItem -Path $backupDirectory -Filter 'zazu-backup-*.zip' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one empty-private-storage backup; found $($archives.Count)." }
          $archive = $archives[0]

          $staleFile = Join-Path $privateRoot 'stale-after-empty-backup.txt'
          [System.IO.File]::WriteAllText($staleFile, 'must be removed by restore', [System.Text.UTF8Encoding]::new($false))

          $mutateScript = Join-Path $env:RUNNER_TEMP 'zazu-empty-private-mutate.php'
          $mutatePhp = @'
          <?php
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $db->exec("UPDATE zazu_windows_recovery_probe SET value = 'after-empty-private-mutation' WHERE id = 1");
          '@
          [System.IO.File]::WriteAllText($mutateScript, $mutatePhp, [System.Text.UTF8Encoding]::new($false))
          php $mutateScript
          if ($LASTEXITCODE -ne 0) { throw 'Could not mutate the empty-private-storage recovery sentinel.' }

          php artisan zazu:restore $archive.FullName --force
          if ($LASTEXITCODE -ne 0) { throw 'Windows empty-private-storage restore failed.' }

          $verifyScript = Join-Path $env:RUNNER_TEMP 'zazu-empty-private-verify.php'
          $verifyPhp = @'
          <?php
          $db = new PDO('sqlite:database/database.sqlite');
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          echo (string) $db->query('SELECT value FROM zazu_windows_recovery_probe WHERE id = 1')->fetchColumn();
          '@
          [System.IO.File]::WriteAllText($verifyScript, $verifyPhp, [System.Text.UTF8Encoding]::new($false))
          $restoredValue = (& php $verifyScript | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $restoredValue -ne 'before-empty-private-restore') {
            throw "Empty-private-storage restore did not recover the database snapshot (received: $restoredValue)."
          }
          if (Test-Path -LiteralPath $staleFile) {
            throw 'Empty-private-storage restore retained a stale private file.'
          }
          $remaining = @(Get-ChildItem -LiteralPath $privateRoot -Force -Recurse)
          if ($remaining.Count -ne 0) {
            throw "Empty-private-storage restore left $($remaining.Count) stale files or directories."
          }

          Write-Host "PASS: Windows restore replaced stale private files with the empty storage snapshot from $($archive.Name)."
      - name: Run the first-install script using Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = (Get-Location).Path

          & (Join-Path $project 'ops/windows/Install-Zazu.ps1') -ProjectPath $project

          if (-not (Test-Path '.env' -PathType Leaf)) { throw 'Installer did not create .env.' }
          if (-not (Test-Path 'database/database.sqlite' -PathType Leaf)) { throw 'Installer did not create the SQLite database.' }

          $envLines = Get-Content '.env'
          foreach ($required in @(
            '^APP_ENV=production$',
            '^APP_DEBUG=false$',
            '^APP_URL=http://127\.0\.0\.1:8000$',
            '^SESSION_SECURE_COOKIE=false$',
            '^DB_CONNECTION=sqlite$',
            '^DB_DATABASE=database/database\.sqlite$'
          )) {
            if (-not ($envLines -match $required)) {
              throw "First-install environment is missing expected production/local setting: $required"
            }
          }

          if (-not ($envLines -match '^APP_KEY=base64:.+')) {
            throw 'Installer did not generate a Laravel application key.'
          }

          $ledgerScript = Join-Path $env:RUNNER_TEMP 'zazu-ledger-acl-probe.php'
          $ledgerProbe = @'
          <?php
          $project = $argv[1];
          chdir($project);
          require $project . '/vendor/autoload.php';
          $app = require $project . '/bootstrap/app.php';
          $kernel = $app->make(\Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          \App\Support\ZazuIncidentLedger::record([
              'request_id' => 'e48b22d4-81ec-4e14-a5e1-8e7b7a19f214',
              'error_code' => 'APP-001',
              'exception_class' => \RuntimeException::class,
          ]);
          '@
          [System.IO.File]::WriteAllText($ledgerScript, $ledgerProbe, [System.Text.UTF8Encoding]::new($false))
          php $ledgerScript $project
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the Windows incident-ledger ACL probe.' }

          $allowedSids = @(
            [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value,
            'S-1-5-18',
            'S-1-5-32-544'
          )
          $privateRoot = Join-Path $project 'storage/app/private'
          $protectedRoots = @(
            $privateRoot,
            (Join-Path $project 'storage/framework'),
            (Join-Path $project 'storage/logs'),
            (Join-Path $project 'database'),
            (Join-Path $project 'bootstrap/cache'),
            (Join-Path $project '.env')
          )
          foreach ($target in $protectedRoots) {
            if (-not (Test-Path -LiteralPath $target)) { throw "Expected protected Zazu data path was not found: $target" }
            $acl = Get-Acl -LiteralPath $target
            if (-not $acl.AreAccessRulesProtected) {
              throw "Protected Zazu data path still inherits broad parent permissions: $target."
            }
            foreach ($rule in $acl.Access) {
              $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
              if ($allowedSids -notcontains $sid -or $rule.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) {
                throw "Protected Zazu data path contains an unexpected Windows access rule for SID $sid at $target."
              }
              if ($rule.IsInherited) {
                throw "Protected Zazu root contains an unexpected inherited access rule: $target."
              }
            }
          }

          $normalisedChildren = @(
            (Join-Path $project 'database/database.sqlite')
          )
          foreach ($target in $normalisedChildren) {
            if (-not (Test-Path -LiteralPath $target)) { throw "Expected protected data file was not created: $target" }
            $acl = Get-Acl -LiteralPath $target
            if (-not $acl.AreAccessRulesProtected) {
              throw "Pre-existing protected data file was not normalised to an explicit restricted ACL: $target."
            }
            foreach ($rule in $acl.Access) {
              $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
              if ($allowedSids -notcontains $sid -or $rule.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow -or $rule.IsInherited) {
                throw "Protected Zazu data file contains an unexpected access rule for SID $sid at $target."
              }
            }
          }

          $inheritedTargets = @(
            (Join-Path $privateRoot 'zazu-diagnostics'),
            (Join-Path $privateRoot 'zazu-diagnostics/incidents.lock'),
            (Join-Path $privateRoot 'zazu-diagnostics/incidents.jsonl')
          )
          foreach ($target in $inheritedTargets) {
            if (-not (Test-Path -LiteralPath $target)) { throw "Expected protected diagnostic path was not created: $target" }
            $acl = Get-Acl -LiteralPath $target
            foreach ($rule in $acl.Access) {
              $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
              if ($allowedSids -notcontains $sid -or $rule.AccessControlType -ne [System.Security.AccessControl.AccessControlType]::Allow) {
                throw "Protected Zazu diagnostic child contains an unexpected Windows access rule for SID $sid at $target."
              }
              if (-not $rule.IsInherited) {
                throw "New Zazu diagnostic child does not inherit its restricted ACL: $target."
              }
            }
          }

          php artisan migrate:status --no-ansi
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-install database migration status failed.' }

          php artisan route:list --path=login --no-ansi
          if ($LASTEXITCODE -ne 0) { throw 'Application route boot failed after installation.' }

          $project = (Get-Location).Path
          $launcher = (Resolve-Path 'ops/windows/Start-ZazuDev.ps1').Path
          $php = (Get-Command php.exe -ErrorAction Stop).Source

          try {
            # Exercise the real owner-PC launcher, not a parallel hand-built
            # php artisan serve command. Its own startup gate must verify HTTP.
            & $launcher -ProjectPath $project -PhpPath $php -Port 8787 -BuiltAssetsOnly

            $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/login' -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) {
              throw 'The launcher started, but the local login page did not return HTTP 200.'
            }

            $setCookie = [string]$response.Headers['Set-Cookie']
            if ([string]::IsNullOrWhiteSpace($setCookie)) {
              throw 'The local login page did not issue a session cookie.'
            }
            if ($setCookie -match '(?i)(^|;)\\s*Secure(\\s*;|$)') {
              throw 'The loopback HTTP session cookie is marked Secure and may not persist on the default local HTTP origin.'
            }
          } finally {
            & $launcher -ProjectPath $project -Port 8787 -Stop
          }

          Write-Host 'PASS: the real Windows Zazu launcher passed its HTTP readiness gate, served the login page and issued a usable loopback session cookie.'


  windows-business-archive-acceptance:
    name: Verify encrypted and legacy business archives on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up PHP 8.4 with SQLite, Sodium and ZIP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sodium, tokenizer, xml, zip
          coverage: none

      - name: Install test dependencies
        shell: powershell
        run: |
          if (-not (Test-Path '.env' -PathType Leaf)) {
            Copy-Item '.env.example' '.env'
          }
          composer install --prefer-dist --no-interaction --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Composer test dependency installation failed.' }

      - name: Run Windows business archive encryption and restore acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          php artisan test --filter=BusinessArchiveEncryption
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows encrypted/legacy business archive acceptance failed.'
          }

          Write-Host 'PASS: Windows verified multi-chunk authenticated encryption, wrong-passphrase and tamper rejection, owner export/restore, and legacy plaintext archive restoration.'


  publish-prerelease:
    name: Publish verified Windows candidate as a GitHub prerelease
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_version != ''
    needs: [package, windows-fresh-install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the exact tested Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4.1.8
        with:
          name: zazu-emp-windows-v1-candidate-${{ github.sha }}
          path: release-assets

      - name: Validate release version and package checksums
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi
          test -f release-assets/SHA256SUMS.txt
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          package_count=$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)
          test "$package_count" -eq 1
          package=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          cp "$package" "ZazuEMP-${RELEASE_VERSION}-Windows.zip"
          sha256sum "ZazuEMP-${RELEASE_VERSION}-Windows.zip" > "ZazuEMP-${RELEASE_VERSION}-Windows.sha256"
          echo "tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package=ZazuEMP-${RELEASE_VERSION}-Windows.zip" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG already exists; refusing to move or reuse it." >&2
            exit 1
          fi

      - name: Publish versioned tested candidate as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ inputs.release_version }}
          PACKAGE: ${{ steps.release.outputs.package }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          # Zazu EMP ${VERSION} — Windows installation candidate

          This prerelease was built from source commit ${SOURCE_SHA} and published only after the Windows fresh-install acceptance job passed.

          - Package type: fresh Windows installation candidate
          - Runtime: PHP 8.4+
          - Database: SQLite
          - Install instructions: see the packaged installation guide
          - SHA-256: verify using the attached checksum file

          **This prerelease is not a declaration that all Zazu V1 commercial, physical-device, recovery and legal acceptance gates are closed.**
          EOF
          gh release create "$TAG" "release-assets/$PACKAGE" "release-assets/ZazuEMP-${VERSION}-Windows.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Zazu EMP ${VERSION} — Windows candidate" \
            --notes-file release-notes.md \
            --prerelease

name: Deploy Zazu pre-launch site

on:
  push:
    branches: [main]
    paths:
      - "prelaunch/**"
      - ".github/workflows/deploy-prelaunch.yml"
      - "public/images/landing/stock/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zazu-prelaunch-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate static site files
        shell: bash
        run: |
          set -euo pipefail
          test -s prelaunch/index.html
          test -s prelaunch/styles.css
          test -s prelaunch/script.js
          test -s prelaunch/privacy.html
          test -s prelaunch/thanks.html
          test -s prelaunch/favicon.svg
          if grep -RInE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' prelaunch; then
            echo "Potential secret material found in prelaunch site."
            exit 1
          fi

      - name: Audit page assets, local links, and security policy
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          root = Path("prelaunch")
          pages = sorted(root.glob("*.html"))
          css = (root / "styles.css").read_text(encoding="utf-8")

          if not pages:
              raise SystemExit("No HTML pages were found.")
          if re.search(r"""url\(\s*['"]?https?://""", css, re.IGNORECASE) or re.search(r"""@import\s+['"]?https?://""", css, re.IGNORECASE):
              raise SystemExit("CSS must not depend on remotely hosted visual assets.")

          class PageAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.h1_count = 0
                  self.has_main = False
                  self.has_language = False
                  self.references = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  if tag == "h1":
                      self.h1_count += 1
                  if tag == "main":
                      self.has_main = True
                  if tag == "html" and attrs.get("lang"):
                      self.has_language = True
                  for key in ("href", "src"):
                      if key in attrs:
                          self.references.append((key, attrs[key]))

          parsed_pages = {}
          for page in pages:
              content = page.read_text(encoding="utf-8")
              audit = PageAudit()
              audit.feed(content)
              parsed_pages[page.name] = (content, audit)
              if "Content-Security-Policy" not in content:
                  raise SystemExit(f"{page}: missing Content-Security-Policy.")
              if not audit.has_language:
                  raise SystemExit(f"{page}: missing document language.")
              if not audit.has_main:
                  raise SystemExit(f"{page}: missing main landmark.")
              if audit.h1_count != 1:
                  raise SystemExit(f"{page}: expected exactly one h1, got {audit.h1_count}.")

          for page in pages:
              _, audit = parsed_pages[page.name]
              for kind, reference in audit.references:
                  parsed = urlsplit(reference)
                  if parsed.scheme or parsed.netloc:
                      if kind == "src":
                          raise SystemExit(f"{page}: remote resource dependency is not allowed: {reference!r}.")
                      continue
                  if not parsed.path:
                      target_path = root / page.name
                  else:
                      target_path = (root / parsed.path.removeprefix("./")).resolve()
                  if not target_path.is_file():
                      raise SystemExit(f"{page}: broken local reference {reference!r}.")
                  if parsed.fragment:
                      target_page = parsed_pages.get(target_path.name)
                      if target_page is None or parsed.fragment not in target_page[1].ids:
                          raise SystemExit(f"{page}: missing fragment #{parsed.fragment} in {target_path.name}.")

          homepage = parsed_pages["index.html"][0]
          if 'rel="canonical"' not in homepage or 'property="og:url"' not in homepage:
              raise SystemExit("Homepage canonical/social URL metadata is incomplete.")
          if "form-action https://formsubmit.co" not in homepage:
              raise SystemExit("CSP does not explicitly allow the intended enquiry form endpoint.")
          if "images.pexels.com" in css or "images.unsplash.com" in css:
              raise SystemExit("Remote stock-photo dependencies must remain removed.")

          print(f"Pre-launch audit passed for {len(pages)} HTML pages; local references, landmarks, CSP policies and visual-asset rules are valid.")
          PY

      - name: Assemble static Pages artifact with bundled imagery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/images/landing
          cp prelaunch/index.html prelaunch/styles.css prelaunch/script.js prelaunch/privacy.html prelaunch/thanks.html prelaunch/favicon.svg site/
          cp public/images/landing/stock/hero.jpg site/images/landing/hero.jpg
          cp public/images/landing/stock/catering.jpg site/images/landing/catering.jpg
          cp public/images/landing/stock/sound.jpg site/images/landing/sound.jpg
          python3 - <<'PY'
          from pathlib import Path

          index = Path("site/index.html")
          content = index.read_text(encoding="utf-8")
          replacements = {
              "../public/images/landing/stock/hero.jpg": "./images/landing/hero.jpg",
              "../public/images/landing/stock/catering.jpg": "./images/landing/catering.jpg",
              "../public/images/landing/stock/sound.jpg": "./images/landing/sound.jpg",
          }
          for source, deployed in replacements.items():
              if content.count(source) != 1:
                  raise SystemExit(f"Expected exactly one reference to {source!r}.")
              content = content.replace(source, deployed)
          index.write_text(content, encoding="utf-8")
          for path in (
              "site/images/landing/hero.jpg",
              "site/images/landing/catering.jpg",
              "site/images/landing/sound.jpg",
          ):
              asset = Path(path)
              if not asset.is_file() or asset.stat().st_size < 10_000:
                  raise SystemExit(f"Missing or unexpectedly small bundled image: {path}")
          print("Assembled the standalone site with three local, bundled image assets.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

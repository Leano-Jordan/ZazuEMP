name: Deploy Zazu pre-launch site

on:
  push:
    branches: [main]
    paths:
      - "prelaunch/**"
      - ".github/workflows/deploy-prelaunch.yml"
      - "public/images/landing/stock/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zazu-prelaunch-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate static site files
        shell: bash
        run: |
          set -euo pipefail
          test -s prelaunch/index.html
          test -s prelaunch/styles.css
          test -s prelaunch/script.js
          test -s prelaunch/privacy.html
          test -s prelaunch/thanks.html
          test -s prelaunch/favicon.svg
          if grep -RInE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' prelaunch; then
            echo "Potential secret material found in prelaunch site."
            exit 1
          fi

      - name: Audit page assets, links, form labels, and content policy
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          root = Path("prelaunch")
          pages = sorted(root.glob("*.html"))
          css = (root / "styles.css").read_text(encoding="utf-8")
          js = (root / "script.js").read_text(encoding="utf-8")

          if not pages:
              raise SystemExit("No HTML pages were found.")
          if css.count("{") != css.count("}"):
              raise SystemExit("CSS braces are unbalanced.")

          # Protect the exact responsive defects found in the pre-launch visual review.
          if "Mobile quality pass:" in css:
              raise SystemExit("Do not append another mobile override layer; update the existing breakpoint owner.")
          if "width:min(1360px,calc(100% - 80px));" not in css:
              raise SystemExit("The hero must stay aligned to the centred content grid.")
          if re.search(r"\.hero-photo-pin\s*\{[^}]*right:\s*-\d+px", css) or re.search(r"\.float-note\s*\{[^}]*left:\s*-\d+px", css):
              raise SystemExit("Hero photo/callout must stay inside the viewport content bounds.")
          if re.search(r"zazu-float|atmosphere-drift|logo-sheen", css):
              raise SystemExit("Perpetual decorative motion is disallowed; use finite, purposeful motion.")
          if "@keyframes photo-enter" not in css or "@keyframes preview-note-enter" not in css:
              raise SystemExit("The purposeful hero entrance motion has been removed.")
          if "grid-template-columns:minmax(0,1fr); align-items:start; gap:18px; padding-block:29px;" not in css:
              raise SystemExit("The mobile footer must collapse into one bounded column.")
          if "prefers-reduced-motion: reduce" not in css or ".hero-photo-pin, .metric, .work-row" not in css:
              raise SystemExit("Reduced-motion support must cover the preview entrance animations.")
          if re.search(r"""url\(\s*['"]?https?://""", css, re.IGNORECASE) or re.search(r"""@import\s+['"]?https?://""", css, re.IGNORECASE):
              raise SystemExit("CSS must not depend on remote assets.")

          class PageAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicate_ids = []
                  self.h1_count = 0
                  self.has_main = False
                  self.has_language = False
                  self.references = []
                  self.srcsets = []
                  self.label_targets = []
                  self.controls = []
                  self.label_depth = 0
                  self.inline_styles = 0
                  self.images_without_alt = []
                  self.inline_scripts = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "style" in attrs:
                      self.inline_styles += 1
                  if "id" in attrs:
                      if attrs["id"] in self.ids:
                          self.duplicate_ids.append(attrs["id"])
                      self.ids.add(attrs["id"])
                  if tag == "h1":
                      self.h1_count += 1
                  if tag == "main":
                      self.has_main = True
                  if tag == "html" and attrs.get("lang"):
                      self.has_language = True
                  if tag == "label":
                      self.label_depth += 1
                      if attrs.get("for"):
                          self.label_targets.append(attrs["for"])
                  if tag in ("input", "select", "textarea"):
                      field_type = attrs.get("type", "").lower()
                      if field_type != "hidden" and attrs.get("name") != "_honey":
                          self.controls.append({
                              "id": attrs.get("id"),
                              "name": attrs.get("name", ""),
                              "wrapped": self.label_depth > 0,
                          })
                  if tag == "img" and "alt" not in attrs:
                      self.images_without_alt.append(attrs.get("src", "(missing src)"))
                  if tag == "script" and not attrs.get("src"):
                      self.inline_scripts += 1
                  for key in ("href", "src"):
                      if key in attrs:
                          self.references.append((key, attrs[key]))
                  if tag == "img" and attrs.get("srcset"):
                      self.srcsets.append(attrs["srcset"])
              def handle_endtag(self, tag):
                  if tag == "label":
                      self.label_depth = max(0, self.label_depth - 1)

          parsed_pages = {}
          for page in pages:
              content = page.read_text(encoding="utf-8")
              audit = PageAudit()
              audit.feed(content)
              parsed_pages[page.name] = (content, audit)
              if "Content-Security-Policy" not in content:
                  raise SystemExit(f"{page}: missing Content-Security-Policy.")
              if not audit.has_language:
                  raise SystemExit(f"{page}: missing document language.")
              if not audit.has_main:
                  raise SystemExit(f"{page}: missing main landmark.")
              if audit.h1_count != 1:
                  raise SystemExit(f"{page}: expected exactly one h1, got {audit.h1_count}.")
              if audit.inline_styles:
                  raise SystemExit(f"{page}: inline style attributes are blocked by policy; move styling to styles.css.")
              if audit.inline_scripts:
                  raise SystemExit(f"{page}: inline scripts are blocked by policy; use script.js.")
              if audit.duplicate_ids:
                  raise SystemExit(f"{page}: duplicate id values: {audit.duplicate_ids}.")
              if audit.images_without_alt:
                  raise SystemExit(f"{page}: image(s) missing alt text: {audit.images_without_alt}.")
              unresolved_labels = [target for target in audit.label_targets if target not in audit.ids]
              if unresolved_labels:
                  raise SystemExit(f"{page}: labels refer to missing controls: {unresolved_labels}.")
              missing_labels = [control for control in audit.controls
                                if not control["wrapped"] and
                                (not control["id"] or control["id"] not in audit.label_targets)]
              if missing_labels:
                  raise SystemExit(f"{page}: form controls without associated visible labels: {missing_labels}.")

          for page in pages:
              _, audit = parsed_pages[page.name]
              for kind, reference in audit.references:
                  parsed = urlsplit(reference)
                  if parsed.scheme or parsed.netloc:
                      allowed_pexels_image = (
                          page.name == "index.html"
                          and kind == "src"
                          and parsed.scheme == "https"
                          and parsed.netloc == "images.pexels.com"
                          and parsed.path.startswith("/photos/")
                      )
                      if kind == "src" and not allowed_pexels_image:
                          raise SystemExit(f"{page}: unapproved remote resource dependency: {reference!r}.")
                      continue
                  if not parsed.path:
                      target_path = root / page.name
                  else:
                      target_path = (root / parsed.path.removeprefix("./")).resolve()
                  if not target_path.is_file():
                      raise SystemExit(f"{page}: broken local reference {reference!r}.")
                  if parsed.fragment:
                      target_page = parsed_pages.get(target_path.name)
                      if target_page is None or parsed.fragment not in target_page[1].ids:
                          raise SystemExit(f"{page}: missing fragment #{parsed.fragment} in {target_path.name}.")
              for srcset in audit.srcsets:
                  for candidate in srcset.split(","):
                      image_url = candidate.strip().split()[0]
                      parsed_image = urlsplit(image_url)
                      if (parsed_image.scheme != "https" or
                              parsed_image.netloc != "images.pexels.com" or
                              not parsed_image.path.startswith("/photos/")):
                          raise SystemExit(f"{page}: srcset contains an unapproved image host/path: {image_url!r}.")

          homepage = parsed_pages["index.html"][0]
          if 'rel="canonical"' not in homepage or 'property="og:url"' not in homepage:
              raise SystemExit("Homepage canonical/social URL metadata is incomplete.")
          if "form-action https://formsubmit.co" not in homepage:
              raise SystemExit("CSP does not explicitly allow the intended enquiry form endpoint.")
          if "connect-src 'self' https://formsubmit.co" not in homepage:
              raise SystemExit("CSP does not explicitly allow the AJAX form connection.")
          if "img-src 'self' https://images.pexels.com;" not in homepage:
              raise SystemExit("CSP must allow same-origin images and the approved Pexels image CDN.")
          if homepage.count("<img") < 5 or "images.pexels.com/photos/" not in homepage or "upload.wikimedia.org" in homepage:
              raise SystemExit("Homepage must include the approved real-photo set and must not reintroduce Wikimedia hotlinks.")
          if "https://formsubmit.co/ajax/rosscorelabs@outlook.com" not in js:
              raise SystemExit("The enquiry form is missing the expected AJAX endpoint.")
          if 'id="form-status"' not in homepage or 'id="form-fallback"' not in homepage:
              raise SystemExit("The enquiry form must expose accessible status and direct-email fallback regions.")
          if 'String(result.success) !== "true"' not in js:
              raise SystemExit("The form must explicitly reject FormSubmit responses where success is false.")
          if "unsafe-inline" in "".join(item[0] for item in parsed_pages.values()):
              raise SystemExit("CSP contains an unsafe-inline directive.")
          print(f"Pre-launch audit passed for {len(pages)} HTML pages: local links, unique IDs, form labels, image alt text, strict CSP, AJAX form response handling, direct-email fallback, and CSS integrity.")
          PY

      - name: Assemble Pages artifact with approved Pexels photography
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp prelaunch/index.html prelaunch/styles.css prelaunch/script.js prelaunch/privacy.html prelaunch/thanks.html prelaunch/image-credits.html prelaunch/favicon.svg site/
          if ! grep -q 'images.pexels.com/photos/' site/index.html || grep -q 'upload.wikimedia.org' site/index.html; then
            echo "Homepage must use the approved Pexels photos, not removed Wikimedia hotlinks."
            exit 1
          fi
          if ! grep -q "img-src 'self' https://images.pexels.com;" site/index.html; then
            echo "Homepage CSP must permit the approved Pexels image CDN."
            exit 1
          fi
          echo "Assembled Pages artifact with approved Pexels photography."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

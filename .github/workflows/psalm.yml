name: Psalm Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '25 14 * * 6'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: vimeo/psalm:6.17.2

      - name: Install project dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply Laravel Psalm compatibility shim
        run: |
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "laravel/framework") { if (($package["version"] ?? null) !== "v13.34.0" || ($package["dist"]["reference"] ?? null) !== "c829b4982d29344cbcf1d7ad78eb5d2bb8ae66c4") { fwrite(STDERR, "Unsupported Laravel framework version for the Psalm compatibility shim.".PHP_EOL); exit(1); } break; } }'
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/laravel/framework/src/Illuminate/Collections/Collection.php")
          text = path.read_text()
          marker = "     * @phpstan-this-out ($key is null ? static<TKey|int, TValue> : $this)\\n"
          found = text.count(marker)
          if found != 1:
              raise SystemExit(f"Expected exactly one unsupported Laravel annotation, found {found}")
          path.write_text(text.replace(marker, ""))
          print("Applied one verified Laravel/Psalm compatibility shim.")
          PY

      - name: Run Psalm security analysis
        run: psalm --taint-analysis --no-progress --report=results.sarif

      - name: Upload Security Analysis results to GitHub
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

name: Psalm Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '25 14 * * 6'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: vimeo/psalm:6.17.2

      - name: Install project dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Apply pinned Laravel Psalm compatibility shim
        run: |
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); $found = false; foreach ($lock["packages"] as $package) { if ($package["name"] === "laravel/framework") { $found = true; if (($package["version"] ?? null) !== "v13.36.0" || ($package["dist"]["reference"] ?? null) !== "e5626e38137cf0d82b1e52f15b16283e8442c13c") { fwrite(STDERR, "Laravel Psalm shim pin does not match composer.lock; review the upstream annotation before changing the pin.".PHP_EOL); exit(1); } break; } } if (!$found) { fwrite(STDERR, "laravel/framework was not found in composer.lock.".PHP_EOL); exit(1); }'
          python3 - <<'PY'
          from pathlib import Path
          path = Path("vendor/laravel/framework/src/Illuminate/Collections/Collection.php")
          text = path.read_text()
          marker = "     * @phpstan-this-out ($key is null ? static<TKey|int, TValue> : $this)\n"
          found = text.count(marker)
          if found != 1:
              raise SystemExit(f"Expected one targeted Laravel annotation, found {found}")
          path.write_text(text.replace(marker, ""))
          print("Applied one verified Laravel/Psalm compatibility shim.")
          PY

      - name: Run Psalm security analysis
        run: psalm --taint-analysis --no-progress --report=results.sarif

      - name: Preserve SARIF report for trusted upload job
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: psalm-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 3

  publish-security-results:
    if: always() && github.event_name != 'pull_request'
    needs: php-security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
    steps:
      - name: Download Psalm SARIF report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: psalm-sarif
          path: results

      - name: Upload trusted-branch security results
        if: hashFiles('results/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results/results.sarif

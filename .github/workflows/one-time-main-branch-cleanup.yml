name: One-Time Main Branch Cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-main-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete every non-main branch
        shell: bash
        run: |
          set -euo pipefail

          for branch in             "backup-pre-merge"             "fix/zazu-auth-owner-foundation"             "hardening/2026-09-26-commercial-polish"             "laravel-foundation"             "merge-laravel-skeleton"             "morpheus/sweep-2026-09-26"
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "$branch already absent"
            fi
          done

          echo "Cleanup complete. main is intentionally untouched."

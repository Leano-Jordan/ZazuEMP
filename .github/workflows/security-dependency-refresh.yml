name: Zazu security dependency refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zazu-security-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'

      - name: Refresh affected Laravel and Symfony components
        run: >-
          composer update laravel/framework
          symfony/http-foundation
          symfony/http-kernel
          symfony/mime
          symfony/routing
          --with-all-dependencies
          --no-interaction
          --no-progress

      - name: Require a clean Composer security audit
        run: composer audit --locked --no-interaction

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies and build
        run: |
          npm ci
          npm run build

      - name: Prepare SQLite test database
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run complete application test suite
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Commit verified dependency lockfile and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- composer.lock; then
            echo "No dependency lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "security: update Laravel and Symfony security fixes"
          BRANCH="security/dependency-refresh-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "security: update Laravel and Symfony dependencies" \
            --body "Automated dependency security remediation. Composer audit, frontend build and full Laravel test suite passed before opening this PR."

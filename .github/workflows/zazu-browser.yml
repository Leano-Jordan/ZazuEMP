name: Zazu browser smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      ZAZU_DEMO_EMAIL: demo@zazu.local
      ZAZU_DEMO_PASSWORD: password
      ZAZU_MANAGER_EMAIL: operations@zazu.local
      ZAZU_STAFF_EMAIL: finance@zazu.local
      ZAZU_ROLE_PASSWORD: password
      # Browser smoke intentionally isolates rate-limit state between requests; authentication throttling is covered by dedicated security tests.
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: Copy environment
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=Database\\Seeders\\DemoScenarioSeeder --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser regression suite
        run: npm run test:e2e -- --workers=1

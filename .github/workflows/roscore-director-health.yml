name: Rosscore Director Health Report

on:
  push:
    paths-ignore:
      - 'docs/health/**'
  workflow_run:
    workflows:
      - Laravel
      - Zazu browser smoke
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  # Serialize report publication so successive CI completions cannot race the report branch.
  group: director-health-publisher
  cancel-in-progress: false

jobs:
  health-report:
    runs-on: ubuntu-latest
    env:
      DIRECTOR: "Jarvis"
      REPOSITORY: "${{ github.repository }}"
      COMMIT_SHA: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
      BRANCH: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 20

      - name: Collect current-head CI evidence
        shell: bash
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs?head_sha=$COMMIT_SHA&per_page=100" > /tmp/runs-pages.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          pages = json.load(open("/tmp/runs-pages.json"))
          data = {"workflow_runs": []}
          for page in pages:
              data["workflow_runs"].extend(page.get("workflow_runs", []))
          required = {"Laravel", "Zazu browser smoke"}
          latest = {}
          for run in data.get("workflow_runs", []):
              name = run.get("name", "")
              if name not in required:
                  continue
              row = {
                  "name": name,
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "run_id": run.get("id"),
                  "url": run.get("html_url"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
              }
              if name not in latest or row["run_id"] > latest[name]["run_id"]:
                  latest[name] = row

          required_rows = [latest.get(name, {
              "name": name, "status": "not_found", "conclusion": None,
              "run_id": None, "url": None
          }) for name in sorted(required)]

          conclusions = [r["conclusion"] for r in required_rows]
          if any(c in {"failure", "cancelled", "timed_out", "action_required", "stale"} for c in conclusions):
              overall = "FAIL"
          elif all(c == "success" for c in conclusions):
              overall = "PASS"
          else:
              overall = "PENDING"

          Path("ci-evidence.json").write_text(json.dumps({
              "target_commit": os.environ["COMMIT_SHA"],
              "overall": overall,
              "required_workflows": required_rows,
          }, indent=2) + "\n")
          PY

      - name: Generate post-commit health report
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, datetime

          root = pathlib.Path(".")
          def run(*args):
              try:
                  return subprocess.check_output(args, text=True, stderr=subprocess.DEVNULL).strip()
              except Exception:
                  return ""

          def exists(p):
              return (root / p).exists()

          sha = os.environ["COMMIT_SHA"]
          state_text = (root / ".ai/engineering/STATE.md").read_text(errors="ignore") if exists(".ai/engineering/STATE.md") else ""
          ci = json.loads(pathlib.Path("ci-evidence.json").read_text())

          def section_value(text, label):
              for line in text.splitlines():
                  if line.strip().startswith(label):
                      return line.split(label, 1)[1].strip().lstrip(":").strip("* ")[:500]
              return ""

          report = {
              "schema": "roscore-director-health/v2",
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["BRANCH"],
              "commit": sha,
              "director": os.environ["DIRECTOR"],
              "commit_message": run("git","log","-1","--pretty=%s"),
              "commit_author": run("git","log","-1","--pretty=%an"),
              "changed_files": run("git","show","--pretty=","--name-only","--format=",sha).splitlines(),
              "engineering": {
                  "active_target": section_value(state_text, "**Active target**"),
                  "next_hard_gate": section_value(state_text, "Next hard gate:"),
                  "readiness_register_present": exists(".ai/engineering/READINESS_REGISTER.md"),
              },
              "ci": ci,
              "signals": {
                  "manifest": exists("ROSCORE_PROJECT_MANIFEST.md"),
                  "agents_contract": exists("AGENTS.md"),
                  "package_json": exists("package.json"),
                  "composer_json": exists("composer.json"),
                  "requirements": exists("requirements.txt") or exists("pyproject.toml"),
                  "github_actions": exists(".github/workflows"),
                  "tests_directory": exists("tests") or exists("test"),
                  "readme": exists("README.md"),
              },
              "latest_commit_age": run("git","log","-1","--format=%cr"),
          }

          p = root / "package.json"
          if p.exists():
              try:
                  pkg = json.loads(p.read_text())
                  scripts = pkg.get("scripts", {})
                  report["package"] = {"name": pkg.get("name"), "version": pkg.get("version"), "scripts": sorted(scripts.keys())}
                  report["signals"]["test_script"] = "test" in scripts
                  report["signals"]["build_script"] = "build" in scripts
                  report["signals"]["lint_script"] = "lint" in scripts
              except Exception as e:
                  report["package_error"] = str(e)
          else:
              report["signals"]["test_script"] = False
              report["signals"]["build_script"] = False
              report["signals"]["lint_script"] = False

          if report["signals"].get("manifest") and report["signals"].get("agents_contract"):
              report["readiness"] = "DIRECTOR_READY"
          elif report["signals"].get("manifest") or report["signals"].get("agents_contract"):
              report["readiness"] = "PARTIAL_DIRECTOR_CONTRACT"
          else:
              report["readiness"] = "NO_DIRECTOR_CONTRACT"

          report["risk_flags"] = []
          if not report["signals"].get("test_script") and not report["signals"].get("tests_directory"):
              report["risk_flags"].append("NO_TEST_SIGNAL")
          if not report["signals"].get("github_actions"):
              report["risk_flags"].append("NO_GITHUB_ACTIONS")
          if not report["signals"].get("readme"):
              report["risk_flags"].append("NO_README")
          if not report["signals"].get("manifest"):
              report["risk_flags"].append("NO_ROSSCORE_MANIFEST")
          if ci["overall"] == "FAIL":
              report["risk_flags"].append("CURRENT_HEAD_CI_FAILURE")
          elif ci["overall"] == "PENDING":
              report["risk_flags"].append("CURRENT_HEAD_CI_PENDING")

          pathlib.Path("roscore-director-health.json").write_text(json.dumps(report, indent=2) + "\n")

          lines = [
              "# Rosscore Director Health Report", "",
              f"- **Repository:** {report['repository']}",
              f"- **Director:** {report['director']}",
              f"- **Branch:** {report['branch']}",
              f"- **Commit:** {report['commit']}",
              f"- **Commit message:** {report['commit_message']}",
              f"- **Readiness:** **{report['readiness']}**",
              f"- **Current-head CI:** **{ci['overall']}**", "",
              "## Current-head CI Evidence", ""
          ]
          for item in ci["required_workflows"]:
              label = item["conclusion"] or item["status"] or "unknown"
              suffix = f" — {item['url']}" if item.get("url") else ""
              lines.append(f"- **{item['name']}**: {label}{suffix}")
          lines += ["", "## Health Signals", ""]
          for k,v in report["signals"].items():
              lines.append(f"- {'PASS' if v else 'WARN'} — {k}")
          lines += ["", "## Risk Flags", ""]
          lines += [f"- {x}" for x in report["risk_flags"]] or ["- None detected by the automated baseline."]
          lines += ["", "## Engineering State", "",
                    f"- **Active target:** {report['engineering']['active_target'] or 'not recorded'}",
                    f"- **Next hard gate:** {report['engineering']['next_hard_gate'] or 'not recorded'}",
                    "", "## Changed Files", ""]
          lines += [f"- {x}" for x in report["changed_files"][:100]] or ["- No file list available."]
          pathlib.Path("roscore-director-health.md").write_text("\n".join(lines) + "\n")
          PY

      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: roscore-director-health-${{ env.COMMIT_SHA }}
          path: |
            roscore-director-health.json
            roscore-director-health.md
          retention-days: 30

      - name: Persist latest Director report
        if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
        shell: bash
        env:
          # `main` is intentionally protected. Health snapshots live on a dedicated
          # report branch while their source commit/branch remains recorded in the report.
          PERSIST_BRANCH: director-health
        run: |
          set -euo pipefail
          mkdir -p docs/health
          cp roscore-director-health.json docs/health/latest.json
          cp roscore-director-health.md docs/health/latest.md
          git config user.name "Rosscore Director"
          git config user.email "director@roscore.local"

          # workflow_run events check out the target SHA, which may be behind a
          # newer health-report commit already published by another completed CI
          # workflow. Always rebase the generated report onto the current remote
          # branch before publishing so report writers cannot create stale pushes.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$PERSIST_BRANCH"
            git checkout -B director-health-publish "origin/$PERSIST_BRANCH"

            cp roscore-director-health.json docs/health/latest.json
            cp roscore-director-health.md docs/health/latest.md
            git add docs/health/latest.json docs/health/latest.md

            if git diff --cached --quiet; then
              echo "Director health report unchanged."
              exit 0
            fi

            git commit -m "chore: update director health report [skip ci]"

            if git push origin HEAD:"$PERSIST_BRANCH"; then
              echo "Director health report published on attempt $attempt."
              exit 0
            fi

            echo "Remote branch moved during publish; retrying."
            git reset --hard "origin/$PERSIST_BRANCH"
          done

          echo "Unable to publish Director health report after 5 attempts."
          exit 1

name: Director Contract Lint

on:
  push:
    branches: [main]
    paths:
      - ".agents/evals/**"
      - ".ai/engineering/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "memory.md"
      - ".github/**"
      - ".ai/archive/**"
      - "docs/**"
  pull_request:
    paths:
      - ".agents/evals/**"
      - ".ai/engineering/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  contract-lint:
    name: Director contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check control-plane formatting
        run: python3 .agents/evals/check_control_plane_format.py
      - name: Validate Director eval definitions and fixtures
        run: python3 .agents/evals/validate_director_evals.py
